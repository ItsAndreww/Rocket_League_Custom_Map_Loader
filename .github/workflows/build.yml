name: Build and Release RLCML

# Цей екшен запускатиметься тільки тоді, коли ти пушиш тег, що починається на "v" (наприклад, v1.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build EXE for Windows
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka zstandard
        pip install -r requirements.txt

    - name: Build with Nuitka
      run: |
        python -m nuitka --assume-yes-for-downloads --standalone --onefile --enable-plugin=tk-inter --windows-console-mode=disable --windows-icon-from-ico=logo.ico --include-data-files=logo.ico=logo.ico map_loader.py

    - name: Rename Output File
      run: |
        Rename-Item -Path "map_loader.exe" -NewName "RLCML_${{ github.ref_name }}.exe"

    - name: Create ZIP Archive
      run: |
        Compress-Archive -Path "RLCML_${{ github.ref_name }}.exe" -DestinationPath "RLCML_${{ github.ref_name }}.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: RLCML_${{ github.ref_name }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}